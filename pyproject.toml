[project]
name = "ai-health-web-assignment"
version = "0.1.0"
description = "흉부 X-ray AI 폐렴 진단 지원 서비스 (FastAPI)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # --- 웹 프레임워크 ---
    "fastapi[standard]>=0.135.3",   # FastAPI + uvicorn + python-multipart(파일 업로드) + email-validator
    "pydantic-settings>=2.13.1",    # .env 설정 로드
    # --- 데이터베이스 ---
    "sqlalchemy[asyncio]>=2.0.49",  # ORM (비동기)
    "aiomysql>=0.2.0",              # MySQL 비동기 드라이버 (순수 파이썬: 컴파일 불필요)
    "aiosqlite>=0.21.0",            # SQLite 비동기 드라이버 (로컬 테스트용)
    "alembic>=1.18.4",              # 마이그레이션
    "cryptography>=46.0.6",         # MySQL 8 인증(caching_sha2_password)에 필요
    "uuid6>=2025.0.1",              # 업로드 파일명(uuid7) 생성
    # --- 인증 ---
    "pyjwt>=2.10.1",                # JWT 발급/검증
    "argon2-cffi>=25.1.0",          # 비밀번호 해싱 (argon2)
    # --- AI 추론 ---
    "torch>=2.6.0",                 # 폐렴 예측 모델 추론
    "numpy>=2.2.0",
    "pillow>=11.0.0",               # 이미지 로드/검증/전처리
]

# torch는 용량이 작은 CPU 전용 버전을 설치한다 (GPU 버전은 수 GB).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
